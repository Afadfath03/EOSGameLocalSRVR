[workspace]
members = ["crates/ascnet-platform", "crates/ascnet-core", "crates/ascnet-gui", "crates/ascnet-cli"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
lz4_flex = "0.11"
reqwest = { version = "0.12", features = ["blocking", "json"] }
uuid = { version = "1", features = ["v4"] }
semver = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"

ascnet-platform = { path = "crates/ascnet-platform" }
ascnet-core = { path = "crates/ascnet-core" }
ascnet-gui = { path = "crates/ascnet-gui" }

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
