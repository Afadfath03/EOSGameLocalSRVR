name: launcher

on:
  pull_request:
    paths:
      - "AscNet.Launcher/**"
      - "AscNet.Patch/**"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "AscNet.Launcher/**"
      - "AscNet.Patch/**"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' AscNet.Launcher/Cargo.toml | head -n1)"
          test -n "$version" || { echo "AscNet.Launcher/Cargo.toml has no workspace version" >&2; exit 1; }
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $tag" >&2; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  patch:
    name: Windows patch DLLs
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build krsdk and lucia
        run: cargo build --release --locked --manifest-path AscNet.Patch/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: microsoft/setup-msbuild@v2
      - name: Build version.dll proxy
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'patch-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          msbuild AscNet.Patch/VersionShim/src/VersionShim.vcxproj /m:1 /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$out\" "/p:IntDir=$PWD/version-obj\"
      - name: Assemble patch bundle
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'patch-out'
          $bundle = Join-Path $PWD 'patch-bundle'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "$PWD/AscNet.Patch/target/x86_64-pc-windows-msvc/release/lucia.dll" $bundle
          Copy-Item "$PWD/AscNet.Patch/target/x86_64-pc-windows-msvc/release/KRSDK.dll" $bundle
          Copy-Item (Join-Path $out 'VersionShim.dll') (Join-Path $bundle 'version.dll')
          Copy-Item "$PWD/AscNet.Launcher/supported-client.json" $bundle
          [IO.File]::WriteAllText((Join-Path $bundle 'libraries.txt'), "*PGR.exe`nlucia.dll`n", (New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath (Join-Path $PWD 'ascnet-patch.zip')
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $PWD 'ascnet-patch.zip')).Hash.ToLower()
          # The bundle URL only exists when this run publishes a release; otherwise the manifest stays empty
          # so setup fails with an actionable message instead of downloading a missing release.
          $tag = if ("${{ needs.prepare.outputs.publish }}" -eq 'true') { "v${{ needs.prepare.outputs.version }}" } else { '' }
          $manifest = [ordered]@{
            url = if ($tag) { "https://github.com/${{ github.repository }}/releases/download/$tag/ascnet-patch.zip" } else { '' }
            sha256 = if ($tag) { $hash } else { '' }
          }
          ConvertTo-Json $manifest | Set-Content -Encoding utf8 patch-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: patch
          path: |
            ascnet-patch.zip
            patch-manifest.json

  windows:
    name: Windows launcher
    needs: patch
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: patch
      - name: Test
        run: cargo test --workspace --manifest-path AscNet.Launcher/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path AscNet.Launcher/Cargo.toml -p ascnet-cli
      - name: Assemble launcher
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'launcher-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item 'AscNet.Launcher/target/release/ascnet-launcher.exe' (Join-Path $out 'AscNetLauncher.exe')
          Copy-Item 'AscNet.Launcher/launcher.json' $out
          Copy-Item 'AscNet.Launcher/setup-local.ps1' $out
          Copy-Item 'AscNet.Launcher/supported-client.json' $out
          Copy-Item 'patch/patch-manifest.json' $out
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath 'AscNetLauncher.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AscNetLauncher.zip

  linux:
    name: Linux AppImage
    needs: patch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: patch
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libwayland-client0 libx11-6 libxi6 libxcursor1 libxrandr2 libxinerama1 libfuse2 file wget
      - name: Test
        run: cargo test --workspace --manifest-path AscNet.Launcher/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path AscNet.Launcher/Cargo.toml -p ascnet-cli
      - name: appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p "$HOME/.local/bin"
          mv appimagetool "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package AppImage
        run: |
          cp patch/patch-manifest.json AscNet.Launcher/patch-manifest.json
          AscNet.Launcher/packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: AscNet.Launcher/AscNetLauncher-x86_64.AppImage

  release:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, patch, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: AscNet Launcher v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/windows/AscNetLauncher.zip
            artifacts/linux/AscNetLauncher-x86_64.AppImage
            artifacts/patch/ascnet-patch.zip
